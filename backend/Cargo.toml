[package]
name = "impossible-apparel"
version = "1.17.0"
edition = "2021"

[[bin]]
name = "impossible-apparel"
path = "src/main.rs"

[[bin]]
name = "migrate-json"
path = "src/bin/migrate_json.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "compression-full", "set-header"] }
http = "1.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "bigdecimal"] }

# Serialization & Datatypes
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }

# Security, Crypto & Auth
rand = "0.8"
hex = "0.4"
base64 = "0.22"
scrypt = "0.11"
subtle = "2.6"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"

# PDF Engine
printpdf = "0.7"

# Utilities & Networking
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
mime_guess = "2.0"
dotenvy = "0.15"
urlencoding = "2.1"
