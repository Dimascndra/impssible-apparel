version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: impossible-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: impossible_apparel
      POSTGRES_USER: impossible_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-impossible_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impossible_user -d impossible_apparel"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - impossible_net

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: impossible-app-rust
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8897}:80"
    environment:
      DATABASE_URL: postgres://impossible_user:${DB_PASSWORD:-impossible_secure_pass_2026}@postgres:5432/impossible_apparel
      APP_PORT: "80"
      APP_HOST: "0.0.0.0"
      IMP_DATA_DIR: "/app/data"
      IMP_UPLOAD_DIR: "/app/uploads"
      IMP_FRONTEND_DIR: "/app/frontend"
      IMP_FONTS_DIR: "/app/fonts"
      RUST_LOG: "info,impossible_apparel=debug"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./frontend:/app/frontend:ro
      - ./backend/fonts:/app/fonts:ro
    networks:
      - impossible_net

volumes:
  postgres_data:
    name: impossible_postgres_data

networks:
  impossible_net:
    name: impossible_network
    driver: bridge
